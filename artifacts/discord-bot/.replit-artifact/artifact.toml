kind = "web"
previewPath = "/discord-bot/"
title = "Discord Bot"
version = "1.0.0"
id = "artifacts/discord-bot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/discord-bot/" ]
localPort = 20320

[services.development]
run = "pnpm --filter @workspace/discord-bot run dev"

[services.production]
run = [ "node", "/home/runner/workspace/index.js" ]

[services.env]
PORT = "20320"
BASE_PATH = "/discord-bot/"
